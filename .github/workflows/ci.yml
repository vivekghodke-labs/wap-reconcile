name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # lint — ruff, fast, no DB
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # ---------------------------------------------------------------------
  # type-check — mypy, no DB
  # ---------------------------------------------------------------------
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mypy core/ backends/ adapters/

  # ---------------------------------------------------------------------
  # test — core suite against a real Postgres service container.
  # apache-airflow is deliberately NOT installed here — core/ has zero
  # orchestrator dependency. tests/test_airflow_operator.py detects this
  # via pytest.importorskip and skips cleanly (see the test-airflow job
  # below for the adapter's own coverage).
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wap_db
          POSTGRES_USER: wap_user
          POSTGRES_PASSWORD: wap_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wap_user -d wap_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wap_user:wap_password@localhost:5432/wap_db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations
        run: python -m db.migrations.run_migrations
      - name: Run test suite
        run: pytest tests/ -v --tb=short
      - name: Run FX pipeline demo (smoke test)
        run: python examples/fx_pipeline_demo.py

  # ---------------------------------------------------------------------
  # test-airflow — the optional Airflow adapter, in its own job.
  # core/ has zero orchestrator dependency (see adapters/airflow_operator.py
  # docstring); this job installs apache-airflow ONLY here, proving the
  # adapter both imports and runs against a real Airflow install without
  # baking that dependency into the core test job above. A failure here
  # never blocks `build`/`publish` — a broken optional adapter must not
  # hold the core framework's release hostage.
  # ---------------------------------------------------------------------
  test-airflow:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wap_db
          POSTGRES_USER: wap_user
          POSTGRES_PASSWORD: wap_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wap_user -d wap_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wap_user:wap_password@localhost:5432/wap_db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-airflow.txt
      - name: Run migrations
        run: python -m db.migrations.run_migrations
      - run: airflow db migrate
      - run: pytest tests/test_airflow_operator.py -v --tb=short

  # ---------------------------------------------------------------------
  # build — sdist + wheel. Runs on every push/PR so a broken pyproject.toml
  # is caught before it ever reaches a tag.
  # ---------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------
  # publish — PyPI, gated on a version tag push only. Requires the
  # PYPI_API_TOKEN repository secret to be configured.
  # ---------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # trusted publishing support, if configured on PyPI
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}