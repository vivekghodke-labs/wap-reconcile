[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wap-reconcile"
version = "0.1.0"
description = "Write-Audit-Publish reconciliation framework — semantic verification against an independent reference before data is trusted downstream."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "wap-reconcile contributors" }]
keywords = ["data-quality", "data-engineering", "wap", "reconciliation", "airflow", "postgres"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "psycopg2-binary>=2.9,<3.0",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.9,<3.0"]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-env>=1.1,<2.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "types-psycopg2>=2.9,<3.0",
    "build>=1.2,<2.0",
]

[project.urls]
Homepage = "https://github.com/your-org/wap-reconcile"
Issues = "https://github.com/your-org/wap-reconcile/issues"

# ---------------------------------------------------------------------------
# Packages shipped in the distribution. Deliberately excludes: adapters/
# is included (it's the optional Airflow extra, gated by the [airflow]
# extra above, not by packaging exclusion) — examples/, tests/, db/migrations
# SQL files ship too since a consumer installing this framework needs the
# schema to bootstrap their own database.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["core*", "assertions_library*", "backends*", "adapters*", "db*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
"db.migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # line length handled by formatter, not a hard gate

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "examples/"]