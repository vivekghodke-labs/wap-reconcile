[pytest]
# Test discovery
testpaths = tests

# Show short tracebacks by default; -v flag adds full detail
addopts = --tb=short

# PYTHONPATH — ensures `from core.models import ...` resolves without
# installing the package. Must match the PYTHONPATH set in Dockerfile
# and docker-compose.yml.
pythonpath = .

# ── pytest-env: environment variables for test sessions ───────────────────
# These are DEFAULTS only. Values already set in the shell environment
# (e.g. DATABASE_URL injected by docker-compose) take precedence.
# D= prefix means: only set if not already defined in the environment.
env =
    D:DATABASE_URL=postgresql://wap_user:wap_password@localhost:5432/wap_db
    D:WAP_POOL_MIN_CONN=1
    D:WAP_POOL_MAX_CONN=5